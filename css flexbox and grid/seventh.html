<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Animation</title>
  <style>
    /* Center everything using Flexbox */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f4f4;
      margin: 0;
    }

    /* Container for circles */
    .loader {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100px;
    }

    /* Common styles for all circles */
    .circle {
      width: 20px;
      height: 20px;
      background-color: #3498db;
      border-radius: 50%;
      animation: bounce 0.8s infinite ease-in-out;
    }

    /* Add animation delays for each circle */
    .circle:nth-child(1) {
      animation-delay: 0s;
    }
    .circle:nth-child(2) {
      animation-delay: 0.2s;
    }
    .circle:nth-child(3) {
      animation-delay: 0.4s;
    }

    /* Keyframes for up-and-down motion */
    @keyframes bounce {
      0%, 80%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(-20px);
      }
    }
  </style>
</head>
<body>
  <div class="loader">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
  </div>
</body>
</html>
