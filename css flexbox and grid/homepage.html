<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Homepage</title>
    <style>
        /* Reset defaults */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== HEADER ===== */
        header {
            background-color: #1f1f1f;
            color: white;
            display: flex;
            justify-content: space-around; /* even spacing */
            align-items: center;
            padding: 20px 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            padding: 8px 15px;
            transition: background-color 0.3s ease;
        }

        nav a:hover {
            background-color: #333;
            border-radius: 5px;
        }

        /* ===== MAIN CONTENT ===== */
        main {
            flex: 1; /* takes remaining vertical space */
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 40px;
            background-color: #f4f4f4;
            flex-wrap: wrap; /* wrap on smaller screens */
        }

        .box {
            background-color: white;
            border: 2px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 250px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: 600;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .box:hover {
            transform: rotate(2deg);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        /* ===== FOOTER ===== */
        footer {
            background-color: #1f1f1f;
            color: white;
            text-align: center;
            padding: 15px 0;
            width: 100%;
        }

        /* ===== RESPONSIVE DESIGN ===== */
        @media (max-width: 700px) {
            main {
                flex-direction: column;
                gap: 20px;
            }

            .box {
                width: 80%;
            }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header>
        <nav>
            <a href="#">Home</a>
            <a href="#">Services</a>
            <a href="#">Projects</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <!-- MAIN CONTENT -->
    <main>
        <div class="box">Services</div>
        <div class="box">Projects</div>
        <div class="box">Contact</div>
    </main>

    <!-- FOOTER -->
    <footer>
        © 2025 Stuti Agrawal. All Rights Reserved.
    </footer>
</body>
</html>
