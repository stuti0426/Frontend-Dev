<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Flip Animation</title>
  <style>
    /* Center the card using Flexbox */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #89f7fe, #66a6ff);
      margin: 0;
      font-family: Arial, sans-serif;
    }

    /* Perspective for 3D effect */
    .card {
      width: 300px;
      height: 400px;
      perspective: 1000px; /* gives depth to the 3D flip */
    }

    /* Card inner wrapper that will rotate */
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.8s ease;
    }

    /* Flip the card on hover */
    .card:hover .card-inner {
      transform: rotateY(180deg);
    }

    /* Common styles for front and back */
    .card-front,
    .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    /* Front side */
    .card-front {
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .card-front img {
      width: 100%;
      height: 70%;
      object-fit: cover;
    }

    .card-front h2 {
      margin: 15px 0;
      color: #333;
    }

    /* Back side */
    .card-back {
      background: #333;
      color: #fff;
      transform: rotateY(180deg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      font-size: 1.1em;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-inner">
      <!-- Front Side -->
      <div class="card-front">
        <img src="https://picsum.photos/300/250?random=9" alt="Card Image">
        <h2>Mountain Escape</h2>
      </div>

      <!-- Back Side -->
      <div class="card-back">
        <p>Discover the beauty of the mountains — a serene escape into nature’s calm and adventure’s thrill.</p>
      </div>
    </div>
  </div>

</body>
</html>
