<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Gallery</title>
    <style>
        /* Reset default spacing */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f5f5f5;
            padding: 40px;
        }

        /* ===== GALLERY CONTAINER ===== */
        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 4 columns on desktop */
            gap: 20px;
        }

        /* ===== PRODUCT CARD ===== */
        .card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            padding: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 200px; /* Equal height cards */
        }

        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .product-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }

        .price {
            font-size: 16px;
            color: #666;
        }

        /* ===== RESPONSIVE DESIGN ===== */
        @media (max-width: 900px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr); /* 2 columns on tablet */
            }
        }

        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: 1fr; /* 1 column on mobile */
            }
        }
    </style>
</head>
<body>
    <h1 style="text-align:center; margin-bottom:30px;">Product Gallery</h1>

    <div class="gallery">
        <div class="card">
            <div class="product-name">Wireless Earbuds</div>
            <div class="price">$49.99</div>
        </div>
        <div class="card">
            <div class="product-name">Smart Watch</div>
            <div class="price">$89.99</div>
        </div>
        <div class="card">
            <div class="product-name">Bluetooth Speaker</div>
            <div class="price">$39.99</div>
        </div>
        <div class="card">
            <div class="product-name">Power Bank</div>
            <div class="price">$29.99</div>
        </div>
        <div class="card">
            <div class="product-name">Laptop Stand</div>
            <div class="price">$24.99</div>
        </div>
        <div class="card">
            <div class="product-name">Mechanical Keyboard</div>
            <div class="price">$59.99</div>
        </div>
        <div class="card">
            <div class="product-name">Gaming Mouse</div>
            <div class="price">$19.99</div>
        </div>
        <div class="card">
            <div class="product-name">USB-C Hub</div>
            <div class="price">$34.99</div>
        </div>
    </div>
</body>
</html>
