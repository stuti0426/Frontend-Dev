<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Card Layout</title>
  <link rel="stylesheet" href="responsive-card-layout.css" />
</head>
<body>
  <h1>Responsive Card Layout</h1>
  <div class="card-container">
    <div class="card">
      <h2>Card 1</h2>
      <p>This is the first card content.</p>
    </div>
    <div class="card">
      <h2>Card 2</h2>
      <p>This is the second card content.</p>
    </div>
    <div class="card">
      <h2>Card 3</h2>
      <p>This is the third card content.</p>
    </div>
  </div>
</body>
</html>
