<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Table</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 40px 0;
            color: #333;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            color: #2c3e50;
        }

        .pricing-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            padding: 0 20px;
        }

        .plan {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
            padding: 25px;
            transition: all 0.3s ease;
        }

        .plan:hover {
            transform: scale(1.05);
            background-color: #e8f0fe;
        }

        .plan h2 {
            margin-bottom: 15px;
            color: #2c3e50;
        }

        .price {
            font-size: 2em;
            color: #3498db;
            margin: 20px 0;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-bottom: 25px;
        }

        li {
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
        }

        a.button {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 10px 25px;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        a.button:hover {
            background-color: #217dbb;
        }

        @media (max-width: 700px) {
            .pricing-container {
                flex-direction: column;
                align-items: center;
            }

            .plan {
                width: 90%;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <h1>Our Pricing Plans</h1>

    <div class="pricing-container">
        <div class="plan">
            <h2>Basic</h2>
            <p class="price">$9/month</p>
            <ul>
                <li>5 Projects</li>
                <li>10GB Storage</li>
                <li>Email Support</li>
            </ul>
            <a href="#" class="button">Choose Plan</a>
        </div>

        <div class="plan" style="border: 2px solid #3498db;">
            <h2>Standard</h2>
            <p class="price">$19/month</p>
            <ul>
                <li>20 Projects</li>
                <li>50GB Storage</li>
                <li>Priority Support</li>
            </ul>
            <a href="#" class="button">Choose Plan</a>
        </div>

        <div class="plan">
            <h2>Premium</h2>
            <p class="price">$29/month</p>
            <ul>
                <li>Unlimited Projects</li>
                <li>200GB Storage</li>
                <li>24/7 Support</li>
            </ul>
            <a href="#" class="button">Choose Plan</a>
        </div>
    </div>
</body>
</html>
