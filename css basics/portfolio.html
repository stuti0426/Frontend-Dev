<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "Poppins", sans-serif;
      background-color: #0f1724;
      color: #f5f5f5;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: #1e293b;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      z-index: 1000;
    }
    header h1 {
      font-size: 1.5rem;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin-left: 1.5em;
      font-size: 1rem;
      transition: color 0.3s ease;
    }
    nav a:hover {
      color: #38bdf8;
    }
    main {
      flex: 1;
      padding-top: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      width: 80%;
      max-width: 1000px;
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0));
      padding: 2rem;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .bio {
      flex: 1;
    }
    .bio h2 {
      font-size: 2rem;
      color: #38bdf8;
    }
    .bio p {
      margin-top: 1rem;
      font-size: 1rem;
      line-height: 1.6;
    }
    .profile {
      width: 40%;
      min-width: 200px;
    }
    .profile img {
      width: 100%;
      border-radius: 50%;
      border: 4px solid #38bdf8;
    }
    footer {
      background-color: #1e293b;
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
      margin-top: auto;
    }
    @media (max-width: 700px) {
      .container {
        flex-direction: column;
        text-align: center;
      }
      .profile {
        width: 50%;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Stuti Agrawal</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>
  <main>
    <div class="container">
      <div class="bio">
        <h2>Hello, I'm Stuti</h2>
        <p>I'm a data analyst and student who loves transforming data into insights and building interactive visualizations. Welcome to my portfolio!</p>
      </div>
      <div class="profile">
        <img src="https://via.placeholder.com/300" alt="Profile Image">
      </div>
    </div>
  </main>
  <footer>
    © 2025 Stuti Agrawal | All Rights Reserved
  </footer>
</body>
</html>
