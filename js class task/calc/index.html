<!DOCTYPE html>
<html>
<head>
    <title>Grocery Bill Calculator</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; }
        .card {
            border: 1px solid #ccc;
            width: 300px;
        }
        input { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; }
        button:hover { background-color: #218838; }
        #result { margin-top: 15px; color: #333; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🛒 Bill Calculator</h2>
        
        <label>Item Price:</label>
        <input type="number" id="price" placeholder="Enter price">

        <label>Quantity:</label>
        <input type="number" id="qty" placeholder="Enter quantity">

        <button onclick="calculateBill()">Get Total Bill</button>

        <div id="result"></div>
    </div>

    <script>
        function calculateBill() {
            let price = Number(document.getElementById("price").value);
            let qty = Number(document.getElementById("qty").value);

            let total = price * qty;

            if (total > 1000) {
                let discount = total * 0.10;
                let finalAmount = total - discount;
            
                document.getElementById("result").innerHTML = 
                    `Subtotal: ₹${total}<br>
                     Discount (10%): -₹${discount}<br>
                     <hr>
                     <strong>Final Bill: ₹${finalAmount}</strong>`;
            } else {
                document.getElementById("result").innerHTML = 
                    `<strong>Final Bill: ₹${total}</strong>`;
            }
        }
    </script>

</body>
</html>
