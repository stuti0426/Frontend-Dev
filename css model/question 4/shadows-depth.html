<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadows and Depth Effect</title>
  <link rel="stylesheet" href="shadows-depth.css">
</head>
<body>
  <main class="card-container">
    <div class="card">
      <h2>Card One</h2>
      <p>This card has a light shadow.</p>
    </div>
    <div class="card medium">
      <h2>Card Two</h2>
      <p>This card has a medium shadow.</p>
    </div>
    <div class="card strong">
      <h2>Card Three</h2>
      <p>This card has a deep shadow.</p>
    </div>
  </main>
</body>
</html>
