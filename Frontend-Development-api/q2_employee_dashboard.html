<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Q2 Employee Dashboard</title>
  <style>
    table { border-collapse: collapse; width: 60%; }
    th, td { border:1px solid #ccc; padding:8px; }
    .error { color: red; }
  </style>
</head>
<body>
  <h2>Employee Status Dashboard</h2>
  <div id="error" class="error"></div>
  <table id="tbl"><thead><tr><th>Name</th><th>Status</th><th>Toggle</th></tr></thead><tbody></tbody></table>

  <script>
    const API = 'http://localhost:3002/employees';
    const tbody = document.querySelector('#tbl tbody');
    const errDiv = document.getElementById('error');

    function fetchEmployees(){
      errDiv.textContent = '';
      const xhr = new XMLHttpRequest();
      xhr.open('GET', API);
      xhr.onload = function(){
        if (xhr.status >= 200 && xhr.status < 300) {
          const data = JSON.parse(xhr.responseText);
          render(data);
        } else {
          errDiv.textContent = 'Failed to load employees.';
        }
      };
      xhr.onerror = function(){ errDiv.textContent = 'Network error while loading employees.'; };
      xhr.send();
    }

    function render(employees){
      tbody.innerHTML = '';
      employees.forEach(emp => {
        const tr = document.createElement('tr');
        const statusText = emp.status;
        tr.innerHTML = `<td>${emp.name}</td>
          <td class="status">${statusText}</td>
          <td><button data-id="${emp.id}" data-status="${statusText}">${statusText === 'active' ? 'Set Inactive' : 'Set Active'}</button></td>`;
        tbody.appendChild(tr);
      });
    }

    tbody.addEventListener('click', function(e){
      if (e.target.tagName !== 'BUTTON') return;
      const btn = e.target;
      const id = btn.dataset.id;
      const current = btn.dataset.status;
      const newStatus = current === 'active' ? 'inactive' : 'active';

      // Optimistically update UI
      const row = btn.closest('tr');
      row.querySelector('.status').textContent = newStatus;
      btn.textContent = newStatus === 'active' ? 'Set Inactive' : 'Set Active';
      btn.dataset.status = newStatus;

      // PATCH request via XHR
      const xhr = new XMLHttpRequest();
      xhr.open('PATCH', API + '/' + id);
      xhr.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');
      xhr.onload = function(){
        if (!(xhr.status >= 200 && xhr.status < 300)) {
          // revert UI and show error
          row.querySelector('.status').textContent = current;
          btn.textContent = current === 'active' ? 'Set Inactive' : 'Set Active';
          btn.dataset.status = current;
          errDiv.textContent = 'Failed to update status. Reverted.';
        }
      };
      xhr.onerror = function(){
        // revert UI and show error
        row.querySelector('.status').textContent = current;
        btn.textContent = current === 'active' ? 'Set Inactive' : 'Set Active';
        btn.dataset.status = current;
        errDiv.textContent = 'Network error while updating status. Reverted.';
      };
      xhr.send(JSON.stringify({ status: newStatus }));
    });

    fetchEmployees();
  </script>
</body>
</html>
