<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Q6 Registration</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
  <h2>User Registration</h2>
  <div id="msg" style="color:red"></div>
  <form id="reg">
    <input name="name" placeholder="Name" required><br>
    <input name="email" placeholder="Email" type="email" required><br>
    <button type="submit">Register</button>
  </form>

  <script>
    const API = 'http://localhost:3006/users';
    const form = document.getElementById('reg');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', function(e){
      e.preventDefault();
      msg.textContent = '';
      const formData = new FormData(form);
      const name = formData.get('name').trim();
      const email = formData.get('email').trim();

      // Check duplicate
      axios.get(API + '?email=' + encodeURIComponent(email))
      .then(res => {
        if (res.data && res.data.length > 0) {
          msg.textContent = 'Email already registered.';
          return Promise.reject('duplicate');
        }
        // POST
        return axios.post(API, { name, email });
      })
      .then(postRes => {
        if (postRes && postRes.data) {
          msg.style.color = 'green';
          msg.textContent = 'Registered successfully.';
          form.reset();
        }
      })
      .catch(err => {
        if (err === 'duplicate') return;
        msg.style.color = 'red';
        msg.textContent = 'Error during registration.';
      });
    });
  </script>
</body>
</html>
