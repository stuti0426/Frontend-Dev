<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Q5 Timetable Viewer</title>
</head>
<body>
  <h2>College Timetable</h2>
  <select id="day">
    <option>Monday</option><option>Tuesday</option><option>Wednesday</option>
    <option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option>
  </select>
  <div id="classes"></div>

  <script>
    const API = 'http://localhost:3005/timetable';
    const daySelect = document.getElementById('day');
    const classesDiv = document.getElementById('classes');

    function load(day) {
      classesDiv.textContent = 'Loading...';
      fetch(API + '?day=' + encodeURIComponent(day))
      .then(r => r.json())
      .then(data => {
        classesDiv.innerHTML = '';
        if (!data || data.length === 0) {
          classesDiv.textContent = 'No classes today.';
          return;
        }
        data.forEach(c => {
          const div = document.createElement('div');
          div.innerHTML = `<strong>${c.subject}</strong><br>Faculty: ${c.faculty} | Time: ${c.time}`;
          classesDiv.appendChild(div);
        });
      })
      .catch(() => { classesDiv.textContent = 'Error loading timetable.'; });
    }

    daySelect.addEventListener('change', () => load(daySelect.value));
    // initial
    load(daySelect.value);
  </script>
</body>
</html>
