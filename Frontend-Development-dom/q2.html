<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Character Counter</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        textarea { width: 100%; height: 100px; padding: 10px; font-size: 16px; box-sizing: border-box; }
        #counter-box { margin-top: 10px; font-weight: bold; }
        .warning { color: #d4ac0d; } /* Yellowish */
        .danger { color: red; }
        button { margin-top: 10px; padding: 8px 16px; cursor: pointer; }
    </style>
</head>
<body>

    <h3>Live Character Counter</h3>
    <textarea id="textBox" placeholder="Type here (Max 100 chars)..."></textarea>
    <div id="counter-box">Remaining: <span id="count">100</span></div>
    <button id="resetBtn">Reset</button>

    <script>
        const textArea = document.getElementById('textBox');
        const countSpan = document.getElementById('count');
        const resetBtn = document.getElementById('resetBtn');
        const MAX_CHARS = 100;

        function updateCounter() {
            const currentLength = textArea.value.length;
            const remaining = MAX_CHARS - currentLength;
            
            countSpan.textContent = remaining;
            
            // Reset classes
            countSpan.className = '';

            // Logic for warning and danger
            if (remaining <= 0) {
                countSpan.classList.add('danger');
            } else if (remaining <= 20) {
                countSpan.classList.add('warning');
            }
        }

        // Use keydown to prevent typing if limit reached (unless deleting)
        textArea.addEventListener('keydown', (e) => {
            const currentLength = textArea.value.length;
            
            // Allowed keys: Backspace, Delete, Arrow keys
            const allowedKeys = ['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'];

            if (currentLength >= MAX_CHARS && !allowedKeys.includes(e.key)) {
                e.preventDefault(); // Stop typing
            }
        });

        // Use input for paste events and general updates
        textArea.addEventListener('input', () => {
            // Hard trim if paste exceeds limit
            if(textArea.value.length > MAX_CHARS) {
                textArea.value = textArea.value.substring(0, MAX_CHARS);
            }
            updateCounter();
        });

        resetBtn.addEventListener('click', () => {
            textArea.value = '';
            updateCounter();
        });
    </script>
</body>
</html>
