<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Gallery Modal</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 600px; }
        .gallery img { width: 100%; height: 150px; object-fit: cover; cursor: pointer; border-radius: 5px; transition: transform 0.2s; }
        .gallery img:hover { transform: scale(1.05); }

        /* Modal Styles */
        .modal-overlay {
            display: none; /* Hidden by default */
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center; align-items: center;
        }
        .modal-content {
            position: relative;
            max-width: 80%;
            max-height: 80%;
        }
        .modal-content img { width: 100%; height: auto; border: 5px solid white; }
    </style>
</head>
<body>

    <h2>Image Gallery</h2>
    <div class="gallery">
        <img src="https://via.placeholder.com/300/FF5733/FFF?text=Img+1" alt="Image 1">
        <img src="https://via.placeholder.com/300/33FF57/FFF?text=Img+2" alt="Image 2">
        <img src="https://via.placeholder.com/300/3357FF/FFF?text=Img+3" alt="Image 3">
        <img src="https://via.placeholder.com/300/FFFF33/000?text=Img+4" alt="Image 4">
        <img src="https://via.placeholder.com/300/FF33FF/FFF?text=Img+5" alt="Image 5">
        <img src="https://via.placeholder.com/300/33FFFF/000?text=Img+6" alt="Image 6">
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <img id="modalImg" src="" alt="Preview">
        </div>
    </div>

    <script>
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modalImg');
        const galleryImages = document.querySelectorAll('.gallery img');

        // 1. Open Modal on click
        galleryImages.forEach(img => {
            img.addEventListener('click', (e) => {
                modal.style.display = 'flex';
                modalImg.src = e.target.src; // Set big image source
            });
        });

        // 2. Close Modal when clicking outside (Overlay)
        modal.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        // 3. Stop Propagation: Clicking the image itself shouldn't close it
        document.querySelector('.modal-content').addEventListener('click', (e) => {
            e.stopPropagation();
        });
    </script>
</body>
</html>
