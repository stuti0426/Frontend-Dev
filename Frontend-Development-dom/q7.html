<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mouse Tracker</title>
    <style>
        body { padding: 20px; font-family: sans-serif; }
        #trackBox {
            width: 400px;
            height: 400px;
            border: 2px solid black;
            position: relative; /* For absolute positioning dots */
            background-color: #fafafa;
            overflow: hidden;
        }
        #coords { margin-top: 10px; font-size: 18px; font-family: monospace; }
        .dot {
            width: 10px; height: 10px;
            background-color: red;
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%); /* Center dot on cursor */
            pointer-events: none; /* Let clicks pass through */
        }
    </style>
</head>
<body>

    <h3>Mouse Tracker (Double click to drop a dot)</h3>
    <div id="trackBox"></div>
    <div id="coords">X: 0, Y: 0</div>

    <script>
        const box = document.getElementById('trackBox');
        const coordsDisplay = document.getElementById('coords');

        // 1. Track Mouse Move
        box.addEventListener('mousemove', (e) => {
            // clientX/Y are relative to viewport
            coordsDisplay.textContent = `X: ${e.clientX}, Y: ${e.clientY}`;
        });

        // 2. Double Click to Drop Dot
        box.addEventListener('dblclick', (e) => {
            // Create the dot
            const dot = document.createElement('div');
            dot.classList.add('dot');
            
            // Position logic: We need position relative to the box
            // but instructions say use clientX/Y for logging, usually imply placing it there too.
            // Since the box is likely at a specific offset, we use offset coordinates for precision inside the box
            // OR we can use clientX if we use fixed positioning, but absolute inside relative parent is better.
            
            const rect = box.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            dot.style.left = `${x}px`;
            dot.style.top = `${y}px`;

            box.appendChild(dot);
        });
    </script>
</body>
</html>
