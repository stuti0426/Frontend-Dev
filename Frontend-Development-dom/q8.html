<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Custom Dropdown</title>
    <style>
        body { font-family: sans-serif; padding: 50px; }
        .dropdown-container { position: relative; display: inline-block; }
        
        .dropdown-btn {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            min-width: 150px;
            text-align: left;
        }

        .dropdown-menu {
            display: none; /* Hidden by default */
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #f9f9f9;
            min-width: 150px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
        }

        .dropdown-menu div {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }

        .dropdown-menu div:hover { background-color: #f1f1f1; }
        .show { display: block; }
    </style>
</head>
<body>

    <h2>Custom Dropdown</h2>
    
    <div class="dropdown-container" id="myDropdown">
        <button class="dropdown-btn" id="toggleBtn">Select Option</button>
        <div class="dropdown-menu" id="menu">
            <div data-value="Option 1">Option 1</div>
            <div data-value="Option 2">Option 2</div>
            <div data-value="Option 3">Option 3</div>
        </div>
    </div>

    <script>
        const container = document.getElementById('myDropdown');
        const btn = document.getElementById('toggleBtn');
        const menu = document.getElementById('menu');

        // 1. Toggle Menu
        btn.addEventListener('click', (e) => {
            menu.classList.toggle('show');
            e.stopPropagation(); // Prevent immediate closing by document listener
        });

        // 2. Select Option
        menu.addEventListener('click', (e) => {
            if(e.target.hasAttribute('data-value')) {
                btn.textContent = e.target.getAttribute('data-value');
                menu.classList.remove('show');
            }
        });

        // 3. Close using Capturing Phase
        // true indicates 'capture' phase (Top -> Down)
        document.addEventListener('click', (e) => {
            if (!container.contains(e.target)) {
                menu.classList.remove('show');
            }
        }, true); 
    </script>
</body>
</html>
